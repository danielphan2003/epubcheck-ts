name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Pack and attach the tarball
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: package.json
          cache: true

      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./packages/epubcheck/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

      - name: Pack
        working-directory: packages/epubcheck
        run: pnpm pack --out "$RUNNER_TEMP/epubcheck-ts-%v.tgz"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          sha256sum epubcheck-ts-*.tgz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" epubcheck-ts-*.tgz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
